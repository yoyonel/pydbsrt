volumes:
  bktreedb-data:

services:
  bktreedb:
    image: docker_bktreedb:test
    build:
      context: pg-spgist_hamming/17-develop/.
      dockerfile: Dockerfile
    volumes:
      - bktreedb-data:/var/lib/postgresql/data
    ports:
      - "${PSQL_PORT:-5433}:5432"
    environment:
      - POSTGRES_DATABASE=bktreedb
      - POSTGRES_DB=bktreedb
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
    restart: on-failure

  postgres_exporter:
    image: wrouesnel/postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://docker:docker@bktreedb:5432/bktreedb?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - bktreedb

  pgweb:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    environment:
      - PGWEB_DATABASE_URL=postgres://docker:docker@bktreedb:5432/bktreedb?sslmode=disable
    ports:
      - "8086:8081"
    depends_on:
      - bktreedb
