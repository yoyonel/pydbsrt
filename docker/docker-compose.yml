volumes:
  bktreedb-data:
  prometheus-data:
  grafana-data:

services:
  bktreedb:
    image: docker_bktreedb:test
    build:
      context: pg-spgist_hamming/17-develop/.
      dockerfile: Dockerfile
    volumes:
      - bktreedb-data:/var/lib/postgresql/data
    ports:
      - "${PSQL_PORT:-5433}:5432"
    environment:
      - POSTGRES_DATABASE=bktreedb
      - POSTGRES_DB=bktreedb
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
    restart: on-failure

  postgres_exporter:
    image: wrouesnel/postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://docker:docker@bktreedb:5432/bktreedb?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - bktreedb

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: on-failure
    depends_on:
      - postgres_exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/01-pydbsrt-corpus-explorer.json
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: on-failure
    depends_on:
      - prometheus
      - bktreedb

  pgweb:
    image: sosedoff/pgweb:latest
    restart: unless-stopped
    environment:
      - PGWEB_DATABASE_URL=postgres://docker:docker@bktreedb:5432/bktreedb?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8086}:8081"
    depends_on:
      - bktreedb
