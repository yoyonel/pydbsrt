{
  "folders": {},
  "connections": {
    "local-bktreedb": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "01. Local bktreedb (x86_64)",
      "save-password": true,
      "read-only": false,
      "configuration": {
        "host": "bktreedb",
        "port": "5432",
        "database": "bktreedb",
        "url": "jdbc:postgresql://bktreedb:5432/bktreedb",
        "type": "dev",
        "auth-properties": {
          "user": "docker",
          "password": "docker"
        },
        "provider-properties": {
          "@dbeaver-show-non-default-db@": "false",
          "@dbeaver-show-template-db@": "false"
        }
      }
    },
    "rpi4-bktreedb": {
      "provider": "postgresql",
      "driver": "postgres-jdbc",
      "name": "02. RPi4 Appliance (aarch64)",
      "save-password": true,
      "read-only": false,
      "configuration": {
        "host": "192.168.1.24",
        "port": "5433",
        "database": "bktreedb",
        "url": "jdbc:postgresql://192.168.1.24:5433/bktreedb",
        "type": "prod",
        "auth-properties": {
          "user": "docker",
          "password": "docker"
        },
        "provider-properties": {
          "@dbeaver-show-non-default-db@": "false",
          "@dbeaver-show-template-db@": "false"
        }
      }
    }
  }
}
