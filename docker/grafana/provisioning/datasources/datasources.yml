apiVersion: 1

prune: true

datasources:
  - name: Prometheus
    uid: prometheus-ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL
    uid: postgres-ds
    type: postgres
    access: proxy
    url: bktreedb:5432
    user: docker
    secureJsonData:
      password: "docker"
    jsonData:
      database: bktreedb
      sslmode: disable
      postgresVersion: 1700
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    editable: false
