version: '3'

vars:
  PROJECT_NAME: pydbsrt
  DOCKER_IMAGE: pydbsrt:latest
  DOCKER_DB_IMAGE: docker_bktreedb:test
  COMPOSE_FILE: docker/docker-compose.yml
  TEST_COMPOSE_FILE: docker/docker-compose.test.yml
  NETWORK_NAME: docker_default
  DB_HOST: docker-bktreedb-1
  PGWEB_PORT: '{{.PGWEB_PORT | default 8086}}'
  DEMO_MEDIA: tests/data/big_buck_bunny_trailer_480p.mp4
  DEMO_TARGET_MEDIA: tests/data/big_buck_bunny_trailer_480p.mp4
  DEMO_SRT: tests/data/big_buck_bunny_trailer_480p.en.srt
  DEMO_PHASH: /tmp/big_buck_bunny_trailer_480p.mp4.25.0fps.phash

includes:
  stack:
    taskfile: ./taskfiles/stack.yml
    flatten: true
  db:
    taskfile: ./taskfiles/db.yml
    flatten: true
  doc:
    taskfile: ./taskfiles/doc.yml
    flatten: true
  quality:
    taskfile: ./taskfiles/quality.yml
    flatten: true
  vlc:
    taskfile: ./taskfiles/vlc.yml
    flatten: true
  client:
    taskfile: ./taskfiles/client.yml
    flatten: true
  rpi4:
    taskfile: ./taskfiles/rpi4.yml
    flatten: true
  eval:
    taskfile: ./taskfiles/eval.yml
    flatten: true
  demo:
    taskfile: ./taskfiles/demo.yml
    flatten: true
  legacy:
    taskfile: ./taskfiles/legacy.yml
    flatten: true

tasks:
  default:
    desc: List available high-level engineering tasks
    cmds:
      - task --list

  # --- Unified Core Stack Lifecycle ---

  up:
    desc: Unified one-command stack startup (DB + PgWeb + Rust build + Certified Couplings + dbsrt-server + VLC plugins + MkDocs)
    aliases: [dev, start]
    cmds:
      - task: studio
      - task: vlc:install-plugin
      - task: doc:daemon
      - task: status

  down:
    desc: Unified one-command stack shutdown (stops dbsrt-server, MkDocs daemon, and Docker DB stack)
    aliases: [stop]
    cmds:
      - task: server:stop
      - task: doc:stop
      - task: db:down

  status:
    desc: Unified health & status dashboard for all running pydbsrt services and backoffices
    cmds:
      - bash scripts/stack_ctl.sh status

  # --- Primary Workspace Actions ---

  build:
    desc: Build all Rust workspace binaries in release mode (dbsrt-cli, dbsrt-server, dbsrt-index)
    aliases: [rs:build]
    cmds:
      - cargo build --release

  test:
    desc: Run unified test suites across Rust workspace and Python tools
    cmds:
      - task: test:rs
      - uv run pytest tests/tools/

  clean:
    desc: Unified purge of caches, coverage, and target/ build artifacts
    cmds:
      - bash scripts/disk_guard.sh clean

  sync:
    desc: Synchronize local virtualenv with uv
    cmds:
      - uv sync --all-groups
