version: '3'

tasks:
  db:up:
    desc: Start PostgreSQL BK-tree container stack in background
    cmds:
      - PGWEB_PORT={{.PGWEB_PORT | default 8086}} docker compose -f {{.COMPOSE_FILE}} up -d --remove-orphans

  db:down:
    desc: Stop PostgreSQL BK-tree container stack
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  db:logs:
    desc: View DB container logs
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} logs -f

  db:psql:
    desc: Open interactive psql shell inside running DB
    interactive: true
    cmds:
      - docker exec -it {{.DB_HOST}} psql -U docker -d bktreedb

  db:import:all-phash:
    desc: Fast batch import of all .phash files into PostgreSQL 17 BK-Tree (Rust native COPY)
    deps: [db:up, rs:build]
    cmds:
      - ./target/release/dbsrt import-phash --phash-dir data/__PHASH__

  db:migrate:
    desc: Run pending PostgreSQL database migrations via refinery
    deps: [db:up, rs:build]
    cmds:
      - ./target/release/dbsrt migrate {{.CLI_ARGS}}

  db:status:
    desc: Check PostgreSQL database schema migration history and status
    deps: [db:up, rs:build]
    cmds:
      - ./target/release/dbsrt migrate --status {{.CLI_ARGS}}

  db:lint:safety:
    desc: Lint PostgreSQL migrations for DDL safety, non-blocking locks, and PG 15/17 compatibility
    cmds:
      - python3 scripts/lint_migrations.py {{.CLI_ARGS}}

  db:test:migration:
    desc: Automated integration test of pending migrations and domain constraints on isolated sandbox DB
    deps: [db:up]
    cmds:
      - uv run python scripts/test_db_migrations.py {{.CLI_ARGS}}

  phash:quarantine:
    desc: Move truncated/corrupted phashes (< 50KB or non-multiple of 8 bytes) to data/__QUARANTINE_PHASH__/
    cmds:
      - uv run python scripts/quarantine_truncated_phashes.py {{.CLI_ARGS}}

  db:backfill:assets:
    desc: Backfill media_sources, moviehash, expected_frames, and V6 lineage columns in PostgreSQL
    deps: [db:up]
    cmds:
      - uv run python scripts/backfill_media_assets.py {{.CLI_ARGS}}

  db:studio:
    desc: Start CloudBeaver Web Studio on port 8978 with pre-configured Local and RPi4 databases
    deps: [db:up]
    cmds:
      - docker compose -f docker/docker-compose.studio.yml up -d
      - echo "🌐 CloudBeaver Studio ready on http://127.0.0.1:8978"

  db:studio:down:
    desc: Stop CloudBeaver Web Studio container
    cmds:
      - docker compose -f docker/docker-compose.studio.yml down

  build-db:
    desc: Build custom PostgreSQL 17 BK-tree Docker image
    internal: true
    cmds:
      - docker build -t {{.DOCKER_DB_IMAGE}} docker/pg-spgist_hamming/17-develop/

  db:tui:
    desc: Launch interactive full-screen Harlequin SQL TUI on local PostgreSQL 17 (:5433)
    interactive: true
    cmds:
      - uvx --with harlequin-postgres harlequin --adapter postgres "postgres://docker:docker@127.0.0.1:5433/bktreedb" {{.CLI_ARGS}}

  db:backfill:medias:
    desc: Backfill rich media metadata from .phash and telemetry into PostgreSQL 17 'medias' table
    cmds:
      - uv run python scripts/backfill_medias_pg.py {{.CLI_ARGS}}

  db:audit:
    desc: Audit NULL values and inspect v_productions view on local PostgreSQL 17
    cmds:
      - uv run python scripts/probe_medias_metadata.py --target local --audit {{.CLI_ARGS}}

  db:probe:
    desc: Probe video streams over NAS LAN FTP and populate real width, height, codec and resolution
    cmds:
      - NAS_HOST="{{.NAS_HOST | default \"192.168.1.58\"}}" uv run python scripts/probe_medias_metadata.py --target local {{.CLI_ARGS}}
