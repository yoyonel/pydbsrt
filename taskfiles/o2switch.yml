version: '3'

tasks:
  o2switch:build:
    desc: Cross-compile static standalone x86_64-musl binaries for o2switch shared hosting
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh build

  o2switch:test-local:
    desc: Empirically test static musl dbsrt-server in Zero-DB mode locally
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh test-local

  o2switch:sync:
    desc: Synchronize gateway, helpers, and SRT store to o2switch (catalog seeded only if missing; binaries ship via o2switch:deploy)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh sync

  o2switch:deploy:
    desc: Build and ship dbsrt-server + dbsrt as a checksummed release, switch atomically, restart, auto-rollback on failure
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh deploy

  o2switch:rollback:
    desc: Switch back to the previous o2switch release and restart the daemon on it
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh rollback

  o2switch:releases:
    desc: List o2switch releases (current, previous, build) and the release the daemon executes
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh releases

  o2switch:start:
    desc: Start standalone unprivileged dbsrt-server daemon on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh start

  o2switch:stop:
    desc: Stop every dbsrt-server daemon on o2switch and block gateway/cron respawn until start
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh stop

  o2switch:restart:
    desc: Restart standalone dbsrt-server daemon on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh restart

  o2switch:e2e:
    desc: Live E2E recette of dbsrt-server on o2switch (lifecycle, respawn, cron, gateway, fixed recognize set), PASS/FAIL only
    cmds:
      - uv run python scripts/e2e/o2switch_e2e.py

  o2switch:e2e:reset-golden:
    desc: Rebuild the fixed recognize query set kept on o2switch (etc/e2e_golden.json), then run the E2E recette
    cmds:
      - uv run python scripts/e2e/o2switch_e2e.py --reset-golden

  o2switch:audit:start:
    desc: "Start the catalog self-recognition audit detached ON o2switch (RUN, SECONDS=10, CUTS=1); the PC can disconnect"
    summary: |
      Runs scripts/o2switch_audit_remote.py on o2switch, detached from the SSH session (fork + setsid): the command
      returns at once and the audit goes on without the workstation. For each .phash already ingested in the catalog
      it sends CUTS windows (1 = the middle; 5 = at 10/30/50/70/90%) of SECONDS to the prod daemon over the internal
      socket (/v1/recognize, no public URL, no OpenSubtitles) and checks the answered title and season/episode.
      Rows hold media names and stay on o2switch in ~/dbsrt/audit/RUN.jsonl; progress goes to ~/dbsrt/logs/audit.log.
      Starting the same RUN again resumes it; a second audit is refused while one runs.
      Example: task o2switch:audit:start RUN=recognize_cuts5_2026-11-02 CUTS=5
    vars:
      RUN: '{{.RUN | default (printf "recognize_%s" (now | date "2006-01-02"))}}'
      SECONDS: '{{.SECONDS | default "10"}}'
      CUTS: '{{.CUTS | default "1"}}'
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh audit start {{.RUN}} {{.SECONDS}} {{.CUTS}}

  o2switch:audit:status:
    desc: Is the o2switch catalog audit running, and how many files are done (counts only)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh audit status

  o2switch:audit:stop:
    desc: Stop the o2switch catalog audit (SIGTERM, only to the audit's own PID); start the same RUN to resume
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh audit stop

  o2switch:audit:burst:
    desc: "Burst-test the portal's stop/resume routes ON o2switch (CYCLES=3): reply and display-sync times, counts only"
    summary: |
      Drives the published run through POST /v1/monitoring/audit/{stop,resume} on the internal socket, like the
      portal buttons: CYCLES paced resume/stop pairs, then clicks with no wait (stop during setup, double stop,
      resume right after stop). Times each HTTP reply and how long until the telemetry shows the state of the last
      accepted order. Fails on any interrupted/failed state or a final state that is not the last order.
      Only runs when the audit is stopped; each resume sends PROD load (~300 recognize/min) until the next stop.
    vars:
      CYCLES: '{{.CYCLES | default "3"}}'
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh audit burst {{.CYCLES}}

  o2switch:audit:report:
    desc: Counts-only report of an o2switch catalog audit (RUN, default the last started run), computed on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh audit report {{.RUN}}

  o2switch:status:
    desc: Check standalone dbsrt-server process and API telemetry on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh status

  o2switch:logs:
    desc: Tail dbsrt-server execution logs on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh logs

  o2switch:demo:
    desc: Test recognition and CAS subtitle retrieval on o2switch API
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh demo

  o2switch:setup-cron:
    desc: Install unprivileged user cron watchdog on o2switch for zero-downtime persistence
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh setup-cron

  o2switch:remove-cron:
    desc: Remove dbsrt-server cron watchdog on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh remove-cron

  o2switch:rotate-key:
    desc: Generate, rotate, and synchronize a new 256-bit API secret key on o2switch and pass
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh rotate-key

  o2switch:rotate-readonly-key:
    desc: Generate the read-only (monitoring GET) key used by shared monitoring links, on o2switch and pass
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh rotate-readonly-key

  o2switch:sync-nas:
    desc: Synchronize Synology NAS .phash fingerprints, binary catalog, and SRT store to Cloud o2switch
    cmds:
      - ./scripts/infra/o2switch/nas_o2switch_sync.sh

  o2switch:sync-nas:dry-run:
    desc: Dry-run simulation of Synology NAS synchronization to Cloud o2switch
    cmds:
      - ./scripts/infra/o2switch/nas_o2switch_sync.sh --dry-run

  o2switch:agent:start:
    desc: Start local dbsrt client relay agent connected to Cloud o2switch
    cmds:
      - ./scripts/infra/local/agent_relay.sh start

  o2switch:agent:stop:
    desc: Stop local dbsrt client relay agent
    cmds:
      - ./scripts/infra/local/agent_relay.sh stop

  o2switch:agent:restart:
    desc: Restart local dbsrt client relay agent
    cmds:
      - ./scripts/infra/local/agent_relay.sh restart

  o2switch:agent:status:
    desc: Check local dbsrt client relay agent status and telemetry
    cmds:
      - ./scripts/infra/local/agent_relay.sh status

  o2switch:agent:logs:
    desc: Tail local dbsrt client relay agent logs
    cmds:
      - ./scripts/infra/local/agent_relay.sh logs

  o2switch:agent:demo:
    desc: Test end-to-end recognition from local/Synology video through Cloud o2switch relay
    cmds:
      - ./scripts/infra/local/agent_relay.sh demo

  o2switch:monitoring:
    desc: Display public monitoring dashboard URL and 4G/5G mobile direct link for o2switch & RPi4
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh monitoring

  o2switch:top:
    desc: Launch interactive dbsrt top TUI process monitor on o2switch via SSH
    interactive: true
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh top {{.CLI_ARGS}}

  o2switch:pull-catalog:
    desc: Pull processed unified catalog.dbphash, SRT subtitles, and batch telemetry from o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh pull-catalog {{.CLI_ARGS}}

  o2switch:backup-nas:
    desc: Backup raw .phash fingerprints from o2switch to Synology NAS persistent storage
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh backup-nas {{.CLI_ARGS}}

  o2switch:batch:tvshow:
    desc: Execute remote batch pHash extraction for virgin NAS episodes on o2switch (supports --daemon)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-tvshow {{.CLI_ARGS}}

  o2switch:batch:movies:
    desc: Execute remote batch pHash extraction for virgin NAS movies (/video) on o2switch (supports --daemon)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-movies {{.CLI_ARGS}}

  o2switch:batch:all:
    desc: Execute remote batch pHash extraction for all virgin NAS media (/tvshow + /video) on o2switch (supports --daemon)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-all {{.CLI_ARGS}}

  o2switch:batch:ahash:tvshow:
    desc: Execute remote batch aHash audio extraction for virgin NAS episodes on o2switch (supports --daemon)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-tvshow --mode ahash {{.CLI_ARGS}}

  o2switch:batch:ahash:movies:
    desc: Execute remote batch aHash audio extraction for virgin NAS movies (/video) on o2switch (supports --daemon)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-movies --mode ahash {{.CLI_ARGS}}

  o2switch:batch:ahash:all:
    desc: Execute remote batch aHash audio extraction for all virgin NAS media (/tvshow + /video) on o2switch (supports --daemon)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-all --mode ahash {{.CLI_ARGS}}

  o2switch:batch:status:
    desc: Check whether remote batch pHash worker is running on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-status

  o2switch:batch:summary:
    desc: Counts-only batch worker summary on o2switch, safe for PR proofs (task o2switch:batch:summary -- [SINCE_ISO])
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-summary {{.CLI_ARGS}}

  o2switch:batch:sync:
    desc: Ship only the batch worker script to o2switch (no SRT, no gateway) and compare its local/remote sha256
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-sync

  o2switch:phash:migrate:
    desc: Rename legacy .phash files to their moviehash name on o2switch, dry run unless -- --apply (counts only)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh phash-migrate {{.CLI_ARGS}}

  o2switch:batch:pause:
    desc: Soft-pause remote batch pHash worker on o2switch (in-flight jobs finish, new jobs blocked)
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-pause

  o2switch:batch:resume:
    desc: Resume remote batch pHash worker on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-resume

  o2switch:batch:scale:
    desc: "Dynamically scale batch worker concurrency (usage: task o2switch:batch:scale -- <workers>)"
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-workers {{.CLI_ARGS}}

  o2switch:batch:workers:
    desc: Query or set dynamic batch worker concurrency on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-workers {{.CLI_ARGS}}

  o2switch:batch:stop:
    desc: Stop running background batch pHash worker on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-stop

  o2switch:batch:logs:
    desc: Tail execution logs of remote batch pHash worker on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh batch-logs

  o2switch:trajectory:run:
    desc: Run spatiotemporal trajectory tracking batch in foreground on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory run {{.CLI_ARGS}}

  o2switch:trajectory:start:
    desc: Start spatiotemporal trajectory tracking batch detached in background on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory start {{.CLI_ARGS}}

  o2switch:trajectory:status:
    desc: Query background trajectory batch worker status and telemetry on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory status

  o2switch:trajectory:stop:
    desc: Stop background trajectory batch worker on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory stop

  o2switch:trajectory:pause:
    desc: Soft-pause background trajectory batch worker on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory pause

  o2switch:trajectory:resume:
    desc: Resume background trajectory batch worker on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory resume

  o2switch:trajectory:logs:
    desc: Tail live execution logs of background trajectory batch on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory logs

  o2switch:trajectory:pull:
    desc: Pull trajectory audit results from o2switch into local data/reports/audit/
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh trajectory pull

  o2switch:faultwatch:start:
    desc: Deploy and start the per-minute LVE fault proxy watcher on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh faultwatch start

  o2switch:faultwatch:stop:
    desc: Stop the LVE fault proxy watcher on o2switch
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh faultwatch stop

  o2switch:faultwatch:status:
    desc: Show LVE fault watcher state and its latest minute records
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh faultwatch status

  o2switch:faultwatch:pull:
    desc: Pull LVE fault watcher minute records into data/reports/faultwatch/
    cmds:
      - ./scripts/infra/o2switch/o2switch_ctl.sh faultwatch pull

  o2switch:faultwatch:correlate:
    desc: Join pulled fault watcher records with a pasted cPanel Resource Usage table (task ... -- <file>)
    cmds:
      - uv run --frozen python scripts/workers/o2switch_fault_watch.py correlate {{.CLI_ARGS}}
