version: '3'

tasks:
  rpi4:build:
    desc: Cross-compile dbsrt-server for aarch64 and package ARM64 Docker image
    cmds:
      - ./scripts/rpi4_build.sh

  rpi4:up:
    desc: Start dbsrt-server stack on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_deploy.sh up

  rpi4:down:
    desc: Stop dbsrt-server stack on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_deploy.sh down

  rpi4:status:
    desc: Check remote dbsrt-server status and metrics on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_deploy.sh status

  rpi4:logs:
    desc: Tail remote dbsrt-server logs on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_deploy.sh logs

  rpi4:sync:
    desc: Synchronize catalog and SRT data to Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_sync.sh

  rpi4:push:
    desc: Stream ARM64 Docker image to Raspberry Pi 4 via SSH
    cmds:
      - ./scripts/rpi4_deploy.sh push

  rpi4:demo:
    desc: Test remote recognition API on Raspberry Pi 4 with 200 bytes pHash payload
    cmds:
      - ./scripts/rpi4_deploy.sh demo

  rpi4:db:build:
    desc: Build native ARM64 PostgreSQL 17 image with BK-Tree on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_deploy.sh db-build

  rpi4:db:up:
    desc: Start dedicated PostgreSQL 17 container on Raspberry Pi 4 (:5433)
    cmds:
      - ./scripts/rpi4_deploy.sh db-up

  rpi4:db:down:
    desc: Stop dedicated PostgreSQL 17 container on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_deploy.sh db-down

  rpi4:db:logs:
    desc: Tail dedicated PostgreSQL 17 container logs on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_deploy.sh db-logs

  rpi4:db:status:
    desc: Check remote PostgreSQL 17 migration status on Raspberry Pi 4 (:5433)
    deps: [rs:build]
    aliases:
      - db:status:rpi4
    cmds:
      - ./scripts/rpi4_deploy.sh db-status {{.CLI_ARGS}}

  rpi4:db:migrate:
    desc: Run pending PostgreSQL database migrations on Raspberry Pi 4 via refinery (:5433)
    deps: [rs:build]
    aliases:
      - db:migrate:rpi4
    cmds:
      - ./scripts/rpi4_deploy.sh db-migrate {{.CLI_ARGS}}

  rpi4:cli:build:
    desc: Cross-compile ARM64 dbsrt CLI binary with Debian Bullseye GLIBC 2.31 parity
    cmds:
      - ./scripts/rpi4_cli.sh build

  rpi4:cli:test:
    desc: Validate ARM64 dbsrt CLI locally on host inside Debian Bullseye container via QEMU
    cmds:
      - ./scripts/rpi4_cli.sh test

  rpi4:cli:deploy:
    desc: Deploy ARM64 dbsrt CLI binary to Raspberry Pi 4 via SSH/SCP
    cmds:
      - ./scripts/rpi4_cli.sh deploy

  rpi4:top:
    desc: Launch interactive dbsrt top TUI session on Raspberry Pi 4 via SSH
    cmds:
      - ./scripts/rpi4_cli.sh top {{.CLI_ARGS}}

  rpi4:server:deploy:
    desc: Deploy standalone ARM64 dbsrt-server binary to Raspberry Pi 4 and configure systemd user service
    cmds:
      - ./scripts/rpi4_standalone.sh deploy

  rpi4:server:start:
    desc: Start standalone dbsrt-server systemd user service on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_standalone.sh start

  rpi4:server:stop:
    desc: Stop standalone dbsrt-server systemd user service on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_standalone.sh stop

  rpi4:server:restart:
    desc: Restart standalone dbsrt-server systemd user service on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_standalone.sh restart

  rpi4:server:status:
    desc: Check standalone dbsrt-server systemd user service and API telemetry on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_standalone.sh status

  rpi4:server:logs:
    desc: Tail live journal logs for standalone dbsrt-server systemd user service on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_standalone.sh logs

  rpi4:server:demo:
    desc: Test recognition and CAS subtitle retrieval on standalone Raspberry Pi 4 server
    cmds:
      - ./scripts/rpi4_standalone.sh demo

  rpi4:supervisor:start:
    desc: Start autonomous 24/7 background supervisor monitoring o2switch batch on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_supervisor_ctl.sh start

  rpi4:supervisor:status:
    desc: Check status of autonomous RPi4 supervisor agent on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_supervisor_ctl.sh status

  rpi4:supervisor:stop:
    desc: Stop autonomous RPi4 supervisor agent on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_supervisor_ctl.sh stop

  rpi4:supervisor:restart:
    desc: Restart autonomous RPi4 supervisor agent on Raspberry Pi 4
    cmds:
      - ./scripts/rpi4_supervisor_ctl.sh restart

  rpi4:supervisor:logs:
    desc: Tail live activity log of autonomous RPi4 supervisor on Raspberry Pi 4
    interactive: true
    cmds:
      - ./scripts/rpi4_supervisor_ctl.sh logs


  sim:up:
    desc: Start local ARM64 simulation container via QEMU binfmt on :8766
    aliases:
      - sim:rpi4:up
    cmds:
      - ./scripts/rpi4_sim.sh up

  sim:down:
    desc: Stop local ARM64 simulation container
    aliases:
      - sim:rpi4:down
    cmds:
      - ./scripts/rpi4_sim.sh down

  sim:status:
    desc: Check local ARM64 simulation container status
    aliases:
      - sim:rpi4:status
    cmds:
      - ./scripts/rpi4_sim.sh status

  sim:logs:
    desc: Tail local ARM64 simulation container logs
    aliases:
      - sim:rpi4:logs
    cmds:
      - ./scripts/rpi4_sim.sh logs

  sim:test:
    desc: Test local ARM64 simulation container endpoints
    aliases:
      - sim:rpi4:test
    cmds:
      - ./scripts/rpi4_sim.sh test
