version: '3'

tasks:
  studio:
    desc: Start PostgreSQL 17 SP-GiST + PgWeb + dbsrt-server and seed certified couplings for dbsrt Studio (/studio)
    cmds:
      - task: db:up
      - task: coupling:certify
      - task: server:stop
      - task: server:daemon
      - task: server:status

  coupling:certify:
    desc: Auto-discover and certify ground-truth (video/.phash <-> subtitle) couplings
    deps: [cli:build]
    cmds:
      - bash scripts/seed_couplings.sh

  media:add:
    desc: "Unified media ingestion facade (usage: task media:add -- <video> [srt] [--lang <lg>] [--fps <val>])"
    deps: [cli:build]
    cmds:
      - bash scripts/media_add.sh {{.CLI_ARGS}}

  media:batch:tvshow:
    desc: "Overnight profiling batch ingestion for TVShow videos and multilingual subtitles from Synology NAS"
    deps: [cli:build]
    cmds:
      - uv run python scripts/batch_media_add_tvshow.py {{.CLI_ARGS}}

  coupling:relabel:
    desc: "Relabel a certified subtitle coupling language (usage: task coupling:relabel -- --media <hash> [--sub <hash>] --lang <code>)"
    deps: [cli:build]
    cmds:
      - bash scripts/coupling_relabel.sh {{.CLI_ARGS}}

  server:status:
    desc: Query dbsrt-server telemetry status endpoint (/v1/status)
    cmds:
      - bash scripts/stack_ctl.sh server-status

  server:reload:
    desc: Trigger atomic zero-downtime catalog reload on dbsrt-server (/v1/catalog/reload)
    cmds:
      - bash scripts/stack_ctl.sh server-reload

  catalog:status:
    desc: Query catalog snapshot (Base + Delta + Couplings) on dbsrt-server (/v1/catalog/status)
    cmds:
      - bash scripts/stack_ctl.sh catalog-status

  catalog:reload:
    desc: Trigger atomic zero-downtime catalog reload on dbsrt-server (/v1/catalog/reload)
    cmds:
      - bash scripts/stack_ctl.sh server-reload

  catalog:notify:reload:
    desc: Broadcast catalog_reload event to all dbsrt-server instances via PostgreSQL LISTEN/NOTIFY
    cmds:
      - PGPASSWORD=docker psql -h 127.0.0.1 -p 5433 -U docker -d bktreedb -c "NOTIFY dbsrt_events, 'catalog_reload'"

  catalog:notify:compact:
    desc: Broadcast catalog_compact event to all dbsrt-server instances via PostgreSQL LISTEN/NOTIFY
    cmds:
      - PGPASSWORD=docker psql -h 127.0.0.1 -p 5433 -U docker -d bktreedb -c "NOTIFY dbsrt_events, 'catalog_compact'"

  catalog:compact:
    desc: Compact Base (.dbphash) and Delta (RAM) on dbsrt-server and hot-reload (/v1/catalog/compact)
    cmds:
      - bash scripts/stack_ctl.sh catalog-compact

  catalog:ingest:
    desc: "Ingest a .phash file dynamically into DeltaIndex in RAM (usage: task catalog:ingest -- <path.phash> [fps])"
    cmds:
      - bash scripts/stack_ctl.sh catalog-ingest {{.CLI_ARGS}}

  server:run:
    desc: Run dbsrt-server daemon in foreground on http://127.0.0.1:8765
    deps: [server:build]
    cmds:
      - ./target/release/dbsrt-server --host 127.0.0.1 --port 8765 --phash-dir /tmp --extra-phash-dir data/__PHASH__ --subtitles-dir data/SRT --db-host 127.0.0.1 --db-port 5433

  server:
    desc: Shortcut to build and run dbsrt-server daemon on http://127.0.0.1:8765
    internal: true
    cmds:
      - task: server:run

  cli:build:
    desc: Build dbsrt CLI release binary
    internal: true
    cmds:
      - cargo build --release --bin dbsrt

  server:build:
    desc: Build dbsrt-server release binary
    internal: true
    cmds:
      - cargo build --release --bin dbsrt-server

  server:daemon:
    desc: Start dbsrt-server daemon in background with logging to /tmp/dbsrt-server.log
    internal: true
    deps: [server:build]
    cmds:
      - bash scripts/stack_ctl.sh server-start

  server:logs:
    desc: Tail background dbsrt-server daemon logs
    internal: true
    cmds:
      - bash scripts/stack_ctl.sh server-logs

  server:stop:
    desc: Stop background dbsrt-server daemon
    internal: true
    cmds:
      - bash scripts/stack_ctl.sh server-stop
