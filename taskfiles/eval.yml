version: '3'

tasks:
  eval:nas:
    desc: Run 5-suite massive quantitative reliability evaluation across PostgreSQL 17, MmapLibrary, NAS videos, and VLC plugin
    deps: [rs:build, server:daemon]
    cmds:
      - uv run python scripts/benchmarks/eval_nas_reliability.py

  eval:nas-snippets:
    desc: Run exhaustive quantitative evaluation matrix across all 4 batteries on real NAS snippets
    deps: [rs:build, server:daemon]
    cmds:
      - uv run --no-sync python scripts/benchmarks/eval_exhaustive_nas_snippets.py {{.CLI_ARGS}}

  eval:matching:multi-offset:
    desc: Benchmark Mono-Window vs Multi-Window Spatiotemporal Recognition on collision-prone snippets
    deps: [rs:build]
    cmds:
      - uv run --no-sync python scripts/benchmarks/eval_multi_offset_matching.py {{.CLI_ARGS}}

  eval:matching:runner:
    desc: Autonomous probe-cached multi-offset matching benchmark runner with soft pause and dynamic workers
    deps: [rs:build]
    cmds:
      - uv run --no-sync python scripts/benchmarks/matching_bench_runner.py {{.CLI_ARGS}}

  eval:trajectory:batch:
    desc: Autonomous spatiotemporal trajectory tracking batch runner with streaming JSONL and dynamic workers
    deps: [rs:build]
    cmds:
      - uv run --no-sync python scripts/benchmarks/trajectory_bench_runner.py {{.CLI_ARGS}}

  eval:trailers:
    desc: Automated empirical verification of pHash matching on remote video streams (YouTube trailers/clips)
    deps: [rs:build]
    cmds:
      - uv run python scripts/ingestion/download_and_audit_all_trailers.py

  eval:cuts:audit:
    desc: Comprehensive performance audit of the 6-stage matching pipeline across all video cuts/snippets
    cmds:
      - uv run python scripts/ingestion/audit_cuts_pipeline.py {{.CLI_ARGS}}

  eval:cuts:audit:rejected:
    desc: Exhaustive forensic diagnostic audit of all rejected cuts in the matching pipeline
    cmds:
      - uv run python scripts/ingestion/audit_rejected_cuts.py {{.CLI_ARGS}}

  bench:mmap-scale:
    desc: Benchmark Zero-DB mmap scanner across all 125 files / 5.08M frames in data/__PHASH__/
    deps: [rs:build]
    cmds:
      - >
        ./target/release/dbsrt scan-library
        --phash-dir data/__PHASH__
        --query-phash data/__PHASH__/Rick.and.Morty.S01.Extras.Deleted.Scene.Pilot.1080p.BluRay.AAC2.0.H.264-BTN.phash
        --search-distance 0
        --limit 5

  bench:cuts-scale:
    desc: Benchmark scene cuts detection throughput on all 5.08M frames in data/__PHASH__/ (Rust Rayon)
    deps: [rs:build]
    cmds:
      - ./target/release/dbsrt bench-cuts --phash-dir data/__PHASH__

  bench:mih:100m:
    desc: Empirical stress test of Multi-Index Hashing (MIH) up to 100 Million frames (100M pHash)
    cmds:
      - cargo run --release -p dbsrt-index --example bench_100m

  bench:flood:
    desc: "End-to-end HTTP matching flood benchmark against local dbsrt-server (usage: task bench:flood -- [-n 1000] [-c 32])"
    cmds:
      - ./scripts/benchmarks/bench_http_flood.sh {{.CLI_ARGS}}

  search:pulp:
    desc: Trigger live end-to-end subtitle search for Pulp Fiction (1080p) against local agent (port 8765)
    cmds:
      - 'curl -s -X POST http://127.0.0.1:8765/v1/search -H "Content-Type: application/json" -d "{\"media_path\": \"{{.USER_WORKING_DIR}}/data/snippets/Pulp.Fiction.1994.1080p.BrRip.x264.YIFY_mid15s.mp4\", \"language\": \"fr\", \"search_mode\": \"phash\"}" | jq .timing'

  search:bullet:
    desc: Trigger live end-to-end subtitle search for Bullet Train (1080p) against local agent (port 8765)
    cmds:
      - 'curl -s -X POST http://127.0.0.1:8765/v1/search -H "Content-Type: application/json" -d "{\"media_path\": \"{{.USER_WORKING_DIR}}/data/snippets/Bullet_Train_(2022)[MULTi][1080p]_mid15s.mp4\", \"language\": \"fr\", \"search_mode\": \"phash\"}" | jq .timing'

  search:madmax:
    desc: Trigger live end-to-end subtitle search for Mad Max (4K HEVC) against local agent (port 8765)
    cmds:
      - 'curl -s -X POST http://127.0.0.1:8765/v1/search -H "Content-Type: application/json" -d "{\"media_path\": \"{{.USER_WORKING_DIR}}/data/snippets/Mad.Max.Fury.Road.2015.2160p.4K.BluRay.x265.10bit.AAC5.1-[YTS.MX]_mid15s.mp4\", \"language\": \"fr\", \"search_mode\": \"phash\"}" | jq .timing'

  bench:cuts-scale:single:
    desc: Benchmark scene cuts detection single-core throughput (Rust Single-thread)
    internal: true
    deps: [rs:build]
    cmds:
      - ./target/release/dbsrt bench-cuts --phash-dir data/__PHASH__ --single-thread

  eval:scale-up:
    desc: Extract pHash on 100+ diverse NAS videos, import millions of frames into PostgreSQL 17, and certify subtitle couplings
    internal: true
    deps: [db:up, rs:build]
    cmds:
      - uv run python scripts/benchmarks/scale_up_nas_dataset.py

  dataset:audit:
    desc: Audit local pHash catalog (230+ files, frame counts, size, and category distribution)
    internal: true
    cmds:
      - uv run python scripts/ingestion/audit_phash_catalog.py

  nas:extract:snippets:
    desc: Extract stratified 15s video snippets and compute pHashes from Synology NAS within 2GB budget
    internal: true
    deps: [rs:build]
    cmds:
      - uv run --no-sync python scripts/ingestion/extract_nas_snippets.py {{.CLI_ARGS}}

  nas:snippets:metadata:
    desc: Enrich extracted NAS snippets with structured metadata (title, year, country, language, season/episode) for DB insertion
    internal: true
    cmds:
      - uv run --no-sync python scripts/ingestion/enrich_snippets_metadata.py {{.CLI_ARGS}}

  nas:ftp:scan:
    desc: Robust Synology NAS FTP crawl (CWD + MLSD) with explicit error, retry, and timeout diagnostics
    cmds:
      - uv run --no-sync python scripts/ingestion/scan_nas_ftp.py {{.CLI_ARGS}}

  nas:snippets:fill:
    desc: Fill missing 15s video snippets from Synology NAS over FTP to achieve 100% coverage of catalog.dbphash (3,061 medias)
    deps: [rs:build]
    cmds:
      - uv run --no-sync python scripts/ingestion/fill_nas_snippets_catalog.py {{.CLI_ARGS}}

  audio:export-ahash:
    desc: Extract Haitsma-Kalker 64-bit audio spectral hash (.ahash v1.0) via dbsrt CLI
    deps: [rs:build]
    cmds:
      - ./target/release/dbsrt export-ahash {{.CLI_ARGS}}

  bench:ahash:matching:
    desc: Run exhaustive acoustic cross-correlation benchmark on .ahash files (Axe 1 temporal, Axe 2 discrimination, Axe 3 throughput)
    aliases: [bench:ahash]
    deps: [rs:build]
    cmds:
      - ./target/release/dbsrt bench-ahash {{.CLI_ARGS}}

  bench:ahash:cuts:
    desc: Benchmark acoustic aHash recognition and headless cvlc auto-sync on video cuts (100% offscreen)
    cmds:
      - uv run python scripts/benchmarks/bench_ahash_cuts.py {{.CLI_ARGS}}

  bench:ahash:mih:matrix:
    desc: Benchmark matrix comparing Linear Scan vs MIH-16 vs MIH-32 (Mono & Rayon) on aHash (106M) and pHash (2.7M)
    cmds:
      - cargo test --release --package dbsrt-index --test test_ahash_mih test_exhaustive_matrix_benchmark -- --nocapture

  bench:ahash:coarse-to-fine:
    desc: Benchmark coarse-to-fine aHash matching across downsampling factors K=1, 4, 8, 16, 31
    cmds:
      - cargo test --release --package dbsrt-index --test test_ahash_coarse_to_fine test_exhaustive_coarse_to_fine_benchmark -- --nocapture
