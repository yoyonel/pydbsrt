          - Plugin VLC v2.0 & OSD: 2026-10-17-validation-ui-ux-vlc-plugin-v2.md
          - Daemon Axum & Plugins Lua: 2026-10-15-vlc-integration-daemon-and-plugins.md
      - Rétro-Ingénierie:
