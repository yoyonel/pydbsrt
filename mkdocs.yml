site_name: "dbsrt — pHash Subtitle Sync & Studio"
site_description: "Portail d'ingénierie, guide opérationnel, architecture pHash et benchmarks du projet pydbsrt / dbsrt-rs"
site_author: "Lionel ATTY"
site_url: "https://yoyonel.github.io/pydbsrt/"
repo_name: "yoyonel/pydbsrt"
repo_url: "https://github.com/yoyonel/pydbsrt"

docs_dir: "docs"
site_dir: "site"

theme:
  name: material
  custom_dir: overrides
  language: fr
  icon:
    logo: material/movie-check-outline
    repo: fontawesome/brands/github
  palette:
    # Palette 1: Dark mode (default — Studio Slate)
    - scheme: slate
      primary: custom
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passer au mode clair
    # Palette 2: Light mode
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Passer au mode sombre
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

hooks:
  - scripts/mkdocs_hooks.py

plugins:
  - search:
      lang: fr
  - tags:
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      auto_caption: true
      caption_position: bottom

extra_css:
  - stylesheets/extra.css
  - stylesheets/asciinema-player.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-svg.js
  - javascripts/panzoom.js
  - javascripts/asciinema-player.min.js
  - javascripts/docs-dates.js
  - javascripts/doc-portal.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

