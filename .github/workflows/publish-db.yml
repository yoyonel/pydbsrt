name: publish-db

on:
  push:
    branches: [develop, master]
    paths:
      - 'docker/pg-spgist_hamming/**'
      - '.github/workflows/publish-db.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        id: repo_owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push PostgreSQL 17 BK-Tree image
        uses: docker/build-push-action@v5
        with:
          context: docker/pg-spgist_hamming/17-develop/
          file: docker/pg-spgist_hamming/17-develop/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/bktreedb:17
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/bktreedb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
