name: "PR Title Lint"

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: "Validate PR Title (Conventional Commits)"
    runs-on: ubuntu-latest
    steps:
      - name: Lint PR Title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            ci
            chore
            build
          requireScope: false
