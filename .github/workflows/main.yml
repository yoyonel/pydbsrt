name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-unit:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Run unit tests
        run: uv run pytest tests/tools/

  rust-ci:
    name: Rust Quality & Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Linting (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit & Integration tests (cargo test)
        run: cargo test --workspace

  db-integration:
    name: PostgreSQL 17 BK-Tree Integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start PostgreSQL 17 BK-Tree container
        run: |
          docker compose -f docker/docker-compose.test.yml pull bktreedb || docker compose -f docker/docker-compose.test.yml build bktreedb
          docker compose -f docker/docker-compose.test.yml up -d bktreedb
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.test.yml exec -T bktreedb pg_isready -U docker -d bktreedb; then
              echo "PostgreSQL 17 BK-Tree is ready!"
              break
            fi
            echo "Waiting for BK-Tree DB container ($i)..."
            sleep 1
          done

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Build dbsrt binary and integration tests
        run: cargo test -p dbsrt-cli --test integration_test --no-run

      - name: Seed database with sample media
        run: |
          ./target/debug/dbsrt export-phash --media data/big_buck_bunny_trailer_480p.webm -o /tmp/big_buck_bunny_trailer_480p.webm.25.0fps.phash
          ./target/debug/dbsrt import-phash --file /tmp/big_buck_bunny_trailer_480p.webm.25.0fps.phash

      - name: Run Rust DB integration tests
        run: |
          PSQL_IP=127.0.0.1 cargo test -p dbsrt-cli --test integration_test -- --nocapture

      - name: Run Python DB integration test suite
        run: |
          PSQL_IP=127.0.0.1 uv run pytest tests/ --ignore=tests/tools/


  docs-check:
    name: Documentation Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Taskfile runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --only-group docs --no-install-project

      - name: Validate documentation (strict build, MathJax, AST)
        run: task doc:check
