name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run pytest
        run: uv run pytest tests/

  rust-ci:
    name: Rust Quality & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Linting (cargo clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit & Integration tests (cargo test)
        run: cargo test --workspace

  db-integration:
    name: PostgreSQL 17 BK-Tree Integration
    runs-on: ubuntu-latest
    services:
      bktreedb:
        image: ghcr.io/yoyonel/bktreedb:17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: bktreedb
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
        options: >-
          --health-cmd "pg_isready -U docker -d bktreedb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build release binaries
        run: cargo build --release

      - name: Seed database with sample media
        run: |
          ./target/release/dbsrt import-phash -r tests/data/big_buck_bunny_trailer_480p.webm.25.0fps.phash

      - name: Run Rust DB integration tests
        run: |
          PSQL_IP=127.0.0.1 cargo test -p dbsrt-cli --test integration_test -- --nocapture

      - name: Run Python DB integration tests
        run: |
          PSQL_IP=127.0.0.1 uv run pytest tests/applications/test_cli_import_imghash_into_db.py tests/applications/test_cli_search_imghash_in_db.py

  docs-check:
    name: Documentation Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Taskfile runner
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate documentation (strict build, MathJax, AST)
        run: task doc:check
