<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/firacode/6.2.0/fira_code.min.css"
    />
    <link data-trunk rel="rust" data-bin="dbsrt-web-top" />
    <title>dbsrt studio ── WebAssembly Monitor (Ratzilla)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #0d1117;
        color: #c9d1d9;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      pre {
        font-family: "Fira Code", monospace;
        font-size: 14px;
        line-height: 1.2;
        margin: 0;
        user-select: none;
      }
      /* Taps are routed by the app (pointerup); stop pan/zoom gestures on the grid. */
      #grid {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <script type="module">
      window.addEventListener("TrunkApplicationStarted", (_) => {
        console.log("dbsrt top WebAssembly client initialized successfully.");
      });
    </script>
  </body>
</html>
