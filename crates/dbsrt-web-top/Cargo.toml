[package]
name = "dbsrt-web-top"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "dbsrt-web-top"
path = "src/main.rs"

[dependencies]
dbsrt-tui = { path = "../dbsrt-tui" }
ratzilla = "0.2.0"
ratatui = { version = "0.29", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Storage", "UrlSearchParams", "KeyboardEvent", "Event", "EventTarget", "PointerEvent", "MouseEvent", "Element", "DomRect", "HtmlCollection"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
