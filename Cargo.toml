[workspace]
members = [
    "crates/dbsrt-core",
    "crates/dbsrt-index",
    "crates/dbsrt-tui",
    "crates/dbsrt-web-top",
    "crates/dbsrt-cli",
    "crates/dbsrt-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lionel ATTY"]
license = "MIT"
repository = "https://github.com/yoyonel/pydbsrt"

[workspace.dependencies]
rayon = "1.10"
memmap2 = "0.9"
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1.0"
thiserror = "2.0"
postgres = { version = "0.19", default-features = false }
refinery = { version = "0.10.0", features = ["postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.43", features = ["full"] }
encoding_rs = "0.8"
chardetng = "1.0"

[profile.dev]
debug = 1
incremental = true

[profile.test]
debug = 1
incremental = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
debug = false
