[workspace]
members = [
    "crates/dbsrt-core",
    "crates/dbsrt-index",
    "crates/dbsrt-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Lionel ATTY"]
license = "MIT"
repository = "https://github.com/yoyonel/pydbsrt"

[workspace.dependencies]
rayon = "1.10"
memmap2 = "0.9"
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
