---
default_stages: [pre-commit]

repos:
  # Generic hygiene (.json, .yaml, .sh shebangs, whitespace)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
        args: [--unsafe]
      - id: check-executables-have-shebangs
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Python: Ruff (Lint & Format across src/, tests/, scripts/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Local native hooks: Rust (.rs), Shell (.sh), Lua (.lua), YAML (.yml), Web (.html/.js)
  - repo: local
    hooks:
      - id: pyright
        name: pyright type check (.py)
        entry: uv run pyright
        language: system
        files: ^(src|tests|scripts)/.*\.py$
        pass_filenames: false

      - id: shellcheck
        name: shellcheck (.sh)
        entry: shellcheck -x
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt (.sh)
        entry: shfmt -i 2 -ci -d
        language: system
        types: [shell]

      - id: yamllint
        name: yamllint (.yml/.yaml)
        entry: yamllint -c .yamllint.yml
        language: system
        types: [yaml]

      - id: docker-compose-check
        name: docker compose config check
        entry: bash -c 'for f in "$@"; do docker compose -f "$f" config -q; done' --
        language: system
        files: ^(docker/docker-compose.*|sim/docker-compose.*)\.ya?ml$

      - id: hadolint
        name: hadolint (.dockerfile / Dockerfile)
        entry: hadolint -c .hadolint.yaml
        language: system
        files: (^|/)(Dockerfile[^/]*|.*\.dockerfile)$

      - id: luac-check
        name: luac bytecode check (.lua)
        entry: luac -p
        language: system
        files: ^vlc-plugin/.*\.lua$

      - id: validate-web-assets
        name: validate HTML/JS/JSON assets (.html/.json)
        entry: uv run python scripts/validate_web_assets.py
        language: system
        files: \.(html|json)$
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt (.rs)
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (.rs)
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-complexity-gate
        name: rust architectural complexity & function size gate
        entry: uv run python scripts/lint_complexity.py
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test (.rs)
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false
