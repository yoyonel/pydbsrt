[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydbsrt"
version = "0.1.0"
description = "Database SubRip Text frame matching and subtitle retargeting"
authors = [{ name = "Lionel ATTY" }]
readme = "README.md"
requires-python = ">=3.9, <3.12"
dependencies = [
    "aiofiles>=0.7.0",
    "asyncpg>=0.21.0",
    "asyncstdlib>=3.9.2",
    "bitstring>=3.1.5",
    "click>=7.1.2",
    "click-pathlib>=2020.3.13",
    "contexttimer>=0.3.3",
    "dictdiffer>=0.8.1",
    "distance>=0.1.3",
    "fuzzywuzzy[speedup]>=0.18.0",
    "googlesearch-python>=1.0.1",
    "googletrans>=2.4.0",
    "httpx>=0.20.0",
    "imagehash>=4.0",
    "imageio>=2.3.0",
    "imageio-ffmpeg>=0.2.0",
    "imdbpy>=2021.4.18",
    "imohash==1.0.4",
    "loguru>=0.5.3",
    "more-itertools>=8.6.0",
    "msgpack>=1.0.0",
    "pandas>=1.3.4",
    "pillow>=8.0.1",
    "prettyprint>=0.1.5",
    "psycopg2-binary>=2.8.6",
    "pybktree>=1.1",
    "pysrt>=1.1.1",
    "python-levenshtein>=0.12.0",
    "python-opensubtitles>=0.2.dev0",
    "python-sql>=1.2.1",
    "rich>=9.3.0",
    "sqlalchemy>=1.3.20",
    "sqltap==0.3.11",
    "tqdm>=4.24.0",
    "types-requests>=2.26.0",
    "ujson>=4.0.1",
    "uvloop>=0.14.0",
    "yaspin>=1.2.0",
]

[project.scripts]
pydbsrt = "pydbsrt.app_cli:entry_point"

[dependency-groups]
dev = [
    "coverage>=5.5",
    "pre-commit>=3.0.0",
    "pyyaml>=6.0.1",
    "pytest>=6.1.2",
    "pytest-asyncio>=0.15.1",
    "pytest-click>=1.0.2",
    "pytest-cov>=2.12.1",
    "pytest-docker-db>=1.1.0",
    "pytest-mock==3.6.1",
    "pytest-picked>=0.4.6",
    "pytest-postgresql>=2.5.2",
    "pytest-shell>=0.2.3",
    "pytest-sugar>=0.9.4",
    "ruff>=0.17.0",
    "sh>=1.14.1",
    "types-aiofiles>=0.1.7",
    "types-click>=7.1.2",
    "waiting>=1.4.1",
    "pytest-lazy-fixtures>=1.4.1",
]
docs = [
    "beautifulsoup4>=4.12.0",
    "mkdocs>=1.6.1",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-material>=9.7.7",
    "pymdown-extensions>=10.21.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "notebook",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (click options)
    "UP006", # keep compatibility with older typing if needed
    "UP035", # deprecated imports
    "B904",  # raise ... from err
    "B905",  # zip(..., strict=...)
    "B007",  # unused loop variable
    "B020",  # loop control variable overrides iterable
    "B006",  # mutable default argument
]

[tool.ruff.lint.isort]
known-first-party = ["pydbsrt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
log_cli = true
log_cli_level = "INFO"
asyncio_mode = "auto"
